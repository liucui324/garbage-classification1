{% extends "base.html" %}
{% set active_page = 'scan' %}

{% block title %}拍照识别 - 智能垃圾分类{% endblock %}

{% block content %}
<div class="scan-page">
    <div class="scan-header">
        <h1>📸 AI拍照识别</h1>
        <p>拍照或上传图片，AI自动识别垃圾类别</p>
    </div>

    <div class="scan-container">
        <div class="camera-box" id="camera-container" style="background: rgba(30, 40, 60, 0.8); backdrop-filter: blur(20px); border-radius: 20px; padding: 2rem; min-height: 300px; display: flex; align-items: center; justify-content: center; border: 2px dashed rgba(255, 255, 255, 0.3);">
            <video id="camera-preview" autoplay playsinline style="display: none; max-width: 100%; border-radius: 12px;"></video>
            <canvas id="capture-canvas" style="display: none;"></canvas>
            <img id="preview-image" style="display: none; max-width: 100%; border-radius: 12px;">
            <div class="camera-placeholder" id="camera-placeholder" style="text-align: center;">
                <i class="fas fa-camera" style="font-size: 4rem; opacity: 0.5; margin-bottom: 1rem;"></i>
                <p style="opacity: 0.7;">点击下方按钮开启摄像头</p>
            </div>
        </div>

        <div class="scan-controls" style="display: flex; gap: 1rem; margin-top: 1.5rem; flex-wrap: wrap;">
            <button class="big-btn camera-btn" onclick="startCamera()" style="flex: 1; min-width: 150px;">
                <i class="fas fa-video"></i>
                <span>开启摄像头</span>
            </button>
            <button class="big-btn capture-btn" id="capture-btn" onclick="capturePhoto()" disabled style="flex: 1; min-width: 150px; opacity: 0.5;">
                <i class="fas fa-camera"></i>
                <span>拍照识别</span>
            </button>
            <label class="big-btn upload-btn" style="flex: 1; min-width: 150px;">
                <i class="fas fa-upload"></i>
                <span>上传图片</span>
                <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="uploadImage(event)">
            </label>
        </div>

        <div class="result-container" id="result-container" style="display: none; margin-top: 2rem;">
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let stream = null;

function startCamera() {
    const video = document.getElementById('camera-preview');
    const placeholder = document.getElementById('camera-placeholder');
    const captureBtn = document.getElementById('capture-btn');
    
    if (stream) {
        stream.getTracks().forEach(track => track.stop());
        video.style.display = 'none';
        placeholder.style.display = 'block';
        captureBtn.disabled = true;
        captureBtn.style.opacity = '0.5';
        stream = null;
        return;
    }
    
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
    .then(s => {
        stream = s;
        video.srcObject = stream;
        video.style.display = 'block';
        placeholder.style.display = 'none';
        captureBtn.disabled = false;
        captureBtn.style.opacity = '1';
    })
    .catch(err => {
        alert('无法访问摄像头，请检查权限设置或使用上传图片功能');
        console.error(err);
    });
}

function capturePhoto() {
    const video = document.getElementById('camera-preview');
    const canvas = document.getElementById('capture-canvas');
    
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    
    canvas.toBlob(blob => {
        const file = new File([blob], 'capture.jpg', { type: 'image/jpeg' });
        recognizeImage(file);
    }, 'image/jpeg');
}

function uploadImage(event) {
    const file = event.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = e => {
        const preview = document.getElementById('preview-image');
        preview.src = e.target.result;
        preview.style.display = 'block';
        document.getElementById('camera-placeholder').style.display = 'none';
        document.getElementById('camera-preview').style.display = 'none';
    };
    reader.readAsDataURL(file);
    
    recognizeImage(file);
}

function recognizeImage(file) {
    document.getElementById('loading').style.display = 'flex';
    
    const formData = new FormData();
    formData.append('image', file);
    
    fetch('/api/recognize', {
        method: 'POST',
        body: formData
    })
    .then(response => response.json())
    .then(data => {
        document.getElementById('loading').style.display = 'none';
        showResult(data);
    })
    .catch(err => {
        document.getElementById('loading').style.display = 'none';
        alert('识别失败，请重试');
        console.error(err);
    });
}

function showResult(data) {
    const container = document.getElementById('result-container');
    container.style.display = 'block';
    
    const confidence = Math.round((data.confidence || 0) * 100);
    
    speak(`识别结果：${data.category}。${data.tip}`);
    
    container.innerHTML = `
        <div class="result-card" style="background: rgba(30, 40, 60, 0.8); backdrop-filter: blur(20px); border-radius: 20px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.1);">
            <div class="result-header" style="background: linear-gradient(135deg, ${data.color}33 0%, ${data.color}66 100%); padding: 2rem; text-align: center;">
                <div style="width: 100px; height: 100px; background: ${data.color}33; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; border: 4px solid ${data.color};">
                    <i class="fas fa-check" style="font-size: 3rem; color: ${data.color};"></i>
                </div>
                <h2 style="font-size: 2.2rem; margin-bottom: 0.8rem;">${data.category}</h2>
                <p style="opacity: 0.8; font-size: 1.1rem;">识别置信度: ${confidence}%</p>
            </div>
            <div class="result-body" style="padding: 2rem;">
                <div style="background: rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 1.5rem; margin-bottom: 1.5rem;">
                    <h4 style="margin-bottom: 0.8rem; font-size: 1.2rem;"><i class="fas fa-info-circle"></i> 投放指引</h4>
                    <p style="opacity: 0.9; font-size: 1.1rem; line-height: 1.6;">${data.tip}</p>
                </div>
                ${data.south_tip ? `
                <div style="background: linear-gradient(135deg, rgba(255, 152, 0, 0.2) 0%, rgba(255, 152, 0, 0.1) 100%); border-radius: 16px; padding: 1.5rem; border-left: 4px solid #FF9800;">
                    <h4 style="margin-bottom: 0.8rem; font-size: 1.2rem;"><i class="fas fa-sun"></i> 南方气候专属提示</h4>
                    <p style="opacity: 0.9; font-size: 1.1rem; line-height: 1.6;">${data.south_tip}</p>
                </div>
                ` : ''}
                <button onclick="speak('${data.category}。${data.tip}')" style="width: 100%; margin-top: 1.5rem; padding: 1.2rem; background: rgba(33, 150, 243, 0.3); border: none; border-radius: 16px; color: #fff; font-size: 1.1rem; cursor: pointer;">
                    <i class="fas fa-volume-up"></i> 语音播报
                </button>
                <div class="volume-control" style="margin-top: 1rem; display: flex; align-items: center; gap: 0.8rem; padding: 0.8rem; background: rgba(255, 255, 255, 0.05); border-radius: 12px;">
                    <i class="fas fa-volume-down" style="color: #9E9E9E;"></i>
                    <input type="range" min="0" max="1" step="0.1" value="${localStorage.getItem('speechVolume') || 0.8}" onchange="setVolume(this.value)" style="flex: 1; height: 6px; cursor: pointer;">
                    <i class="fas fa-volume-up" style="color: #2196F3;"></i>
                    <span id="volume-display" style="min-width: 40px; font-size: 0.9rem;">${Math.round((localStorage.getItem('speechVolume') || 0.8) * 100)}%</span>
                </div>
            </div>
        </div>
    `;
}

let currentSpeechText = '';
let speechCharIndex = 0;
let isAdjustingVolume = false;

function speak(text, startIndex = 0) {
    if ('speechSynthesis' in window) {
        const textToSpeak = text.substring(startIndex);
        if (!textToSpeak.trim()) return;
        
        currentSpeechText = text;
        speechCharIndex = startIndex;
        speechSynthesis.cancel();
        
        const volume = parseFloat(localStorage.getItem('speechVolume') || 0.8);
        const utterance = new SpeechSynthesisUtterance(textToSpeak);
        utterance.lang = 'zh-CN';
        utterance.rate = 0.9;
        utterance.pitch = 1;
        utterance.volume = volume;
        
        utterance.onboundary = (event) => {
            if (event.name === 'word') {
                speechCharIndex = startIndex + event.charIndex;
            }
        };
        
        utterance.onend = () => {
            if (!isAdjustingVolume) {
                currentSpeechText = '';
                speechCharIndex = 0;
            }
        };
        
        console.log('语音播报音量:', volume, ', 从第', startIndex, '个字符开始');
        
        speechSynthesis.speak(utterance);
    }
}

function setVolume(value) {
    localStorage.setItem('speechVolume', value);
    const display = document.getElementById('volume-display');
    if (display) {
        display.textContent = Math.round(value * 100) + '%';
    }
    
    if (currentSpeechText && speechSynthesis.speaking) {
        isAdjustingVolume = true;
        speak(currentSpeechText, speechCharIndex);
        setTimeout(() => { isAdjustingVolume = false; }, 100);
    }
}

window.addEventListener('beforeunload', () => {
    if (stream) {
        stream.getTracks().forEach(track => track.stop());
    }
});
</script>
{% endblock %}
