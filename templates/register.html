<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户注册 - 智能垃圾分类</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=20260531v4">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0a1628 0%, #1a2a4a 50%, #0d1f3c 100%);
            padding: 1rem;
        }
        
        .register-container {
            width: 100%;
            max-width: 480px;
            background: rgba(30, 40, 60, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        .register-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .register-logo {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #2E7D32 0%, #0288D1 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            animation: logoSpin 10s linear infinite;
        }
        
        @keyframes logoSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .register-logo i {
            font-size: 2.5rem;
            color: white;
        }
        
        .register-header h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            color: white;
        }
        
        .register-header p {
            opacity: 0.7;
            font-size: 1rem;
        }
        
        .form-group {
            margin-bottom: 1.3rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
            font-weight: 500;
            opacity: 0.9;
        }
        
        .form-input {
            width: 100%;
            padding: 1rem 1.2rem;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            color: white;
            font-size: 1.05rem;
            transition: all 0.3s;
            outline: none;
        }
        
        .form-input:focus {
            border-color: #2E7D32;
            background: rgba(46, 125, 50, 0.1);
            box-shadow: 0 0 20px rgba(46, 125, 50, 0.2);
        }
        
        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }
        
        .input-icon-wrapper {
            position: relative;
        }
        
        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 1.1rem;
        }
        
        .input-icon-wrapper .form-input {
            padding-left: 3rem;
        }
        
        .password-wrapper {
            position: relative;
        }
        
        .toggle-password {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            font-size: 1.1rem;
            transition: color 0.3s;
        }
        
        .toggle-password:hover {
            color: white;
        }
        
        .register-btn {
            width: 100%;
            padding: 1.3rem;
            background: linear-gradient(135deg, #2E7D32 0%, #0288D1 100%);
            border: none;
            border-radius: 16px;
            color: white;
            font-size: 1.15rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 0.5rem;
        }
        
        .register-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(46, 125, 50, 0.4);
        }
        
        .register-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .login-footer {
            text-align: center;
            margin-top: 1.8rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .login-footer p {
            opacity: 0.7;
            margin-bottom: 0.5rem;
        }
        
        .login-footer a {
            color: #2196F3;
            font-weight: 600;
            text-decoration: none;
        }
        
        .login-footer a:hover {
            text-decoration: underline;
        }
        
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            margin-top: 1.5rem;
            font-size: 0.95rem;
            transition: all 0.3s;
        }
        
        .back-link:hover {
            color: white;
        }
        
        .error-message {
            background: rgba(244, 67, 54, 0.2);
            border-left: 4px solid #F44336;
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.3rem;
            color: #F44336;
            font-size: 0.95rem;
            display: none;
        }
        
        .success-message {
            background: rgba(76, 175, 80, 0.2);
            border-left: 4px solid #4CAF50;
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.3rem;
            color: #4CAF50;
            font-size: 0.95rem;
            display: none;
        }
        
        .tips-box {
            background: linear-gradient(135deg, rgba(76, 175, 80, 0.15) 0%, rgba(33, 150, 243, 0.15) 100%);
            border-radius: 14px;
            padding: 1.2rem;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            opacity: 0.85;
        }
        
        .tips-box h4 {
            margin-bottom: 0.6rem;
            color: #4CAF50;
        }
        
        .tips-box ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .tips-box li {
            padding: 0.25rem 0;
            padding-left: 1.2rem;
            position: relative;
        }
        
        .tips-box li::before {
            content: '•';
            position: absolute;
            left: 0;
            color: #4CAF50;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-header">
            <div class="register-logo">
                <i class="fas fa-recycle"></i>
            </div>
            <h1>创建账户</h1>
            <p>注册成为智能垃圾分类用户</p>
        </div>
        
        <div id="error-msg" class="error-message"></div>
        <div id="success-msg" class="success-message"></div>
        
        <form id="register-form" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label for="username">用户名</label>
                <div class="input-icon-wrapper">
                    <i class="fas fa-user input-icon"></i>
                    <input type="text" id="username" name="username" class="form-input" placeholder="请输入用户名（3-20个字符）" required autocomplete="username" minlength="3" maxlength="20">
                </div>
            </div>
            
            <div class="form-group">
                <label for="password">密码</label>
                <div class="input-icon-wrapper password-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="password" name="password" class="form-input" placeholder="请输入密码（至少6位）" required minlength="6" autocomplete="new-password">
                    <button type="button" class="toggle-password" onclick="togglePassword('password')">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            
            <div class="form-group">
                <label for="confirm-password">确认密码</label>
                <div class="input-icon-wrapper password-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="confirm-password" name="confirm-password" class="form-input" placeholder="请再次输入密码" required minlength="6" autocomplete="new-password">
                    <button type="button" class="toggle-password" onclick="togglePassword('confirm-password')">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            
            <button type="submit" class="register-btn" id="submit-btn">
                <i class="fas fa-user-plus"></i> 注册
            </button>
        </form>
        
        <div class="tips-box">
            <h4><i class="fas fa-lightbulb"></i> 注册提示</h4>
            <ul>
                <li>用户名支持中文、字母、数字</li>
                <li>密码建议包含字母和数字</li>
                <li>注册后可记录投放历史</li>
                <li>可查看个人环保数据统计</li>
            </ul>
        </div>
        
        <div class="login-footer">
            <p>已有账号？<a href="/login">立即登录</a></p>
        </div>
        
        <a href="/" class="back-link">
            <i class="fas fa-arrow-left"></i> 返回首页
        </a>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script>
    function togglePassword(inputId) {
        const input = document.getElementById(inputId);
        const btn = event.currentTarget.querySelector('i');
        
        if (input.type === 'password') {
            input.type = 'text';
            btn.classList.remove('fa-eye');
            btn.classList.add('fa-eye-slash');
        } else {
            input.type = 'password';
            btn.classList.remove('fa-eye-slash');
            btn.classList.add('fa-eye');
        }
    }
    
    function handleRegister(event) {
        event.preventDefault();
        
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirm-password').value;
        const submitBtn = document.getElementById('submit-btn');
        
        hideError();
        hideSuccess();
        
        if (username.length < 3) {
            showError('用户名至少需要3个字符');
            return;
        }
        
        if (password.length < 6) {
            showError('密码至少需要6位');
            return;
        }
        
        if (password !== confirmPassword) {
            showError('两次输入的密码不一致');
            return;
        }
        
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 注册中...';
        
        fetch('/api/register', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ username, password })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                showSuccess('注册成功！正在跳转到登录页面...');
                setTimeout(() => {
                    window.location.href = '/login';
                }, 2000);
            } else {
                showError(data.message || '注册失败，请重试');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-user-plus"></i> 注册';
            }
        })
        .catch(error => {
            showError('网络错误，请稍后重试');
            console.error(error);
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fas fa-user-plus"></i> 注册';
        });
    }
    
    function showError(msg) {
        const el = document.getElementById('error-msg');
        el.textContent = msg;
        el.style.display = 'block';
    }
    
    function hideError() {
        document.getElementById('error-msg').style.display = 'none';
    }
    
    function showSuccess(msg) {
        const el = document.getElementById('success-msg');
        el.textContent = msg;
        el.style.display = 'block';
    }
    
    function hideSuccess() {
        document.getElementById('success-msg').style.display = 'none';
    }
    
    document.getElementById('username').focus();
    </script>
</body>
</html>
