{% extends "base.html" %}
{% set active_page = 'devices' %}

{% block title %}设备管理 - 智能垃圾分类{% endblock %}

{% block content %}
<style>
.devices-page {
    max-width: 900px;
    margin: 0 auto;
    padding: 2rem 1.5rem;
}

/* 页面头部 */
.devices-header {
    text-align: center;
    margin-bottom: 2.5rem;
    position: relative;
    padding: 2rem;
    background: linear-gradient(135deg, rgba(33, 150, 243, 0.12) 0%, rgba(156, 39, 176, 0.08) 100%);
    border-radius: 24px;
    border: 1px solid rgba(33, 150, 243, 0.15);
    overflow: hidden;
}

.devices-header::before {
    content: '';
    position: absolute;
    top: -50%;
    right: -20%;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(33, 150, 243, 0.1) 0%, transparent 70%);
    border-radius: 50%;
    animation: header-float 6s ease-in-out infinite;
}

.devices-header::after {
    content: '';
    position: absolute;
    bottom: -40%;
    left: -10%;
    width: 250px;
    height: 250px;
    background: radial-gradient(circle, rgba(156, 39, 176, 0.08) 0%, transparent 70%);
    border-radius: 50%;
    animation: header-float 8s ease-in-out infinite reverse;
}

@keyframes header-float {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(10px, -10px); }
}

.devices-header h1 {
    font-size: 2rem;
    font-weight: 700;
    background: linear-gradient(135deg, #2196F3 0%, #9C27B0 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 0.5rem;
    position: relative;
    z-index: 1;
}

.devices-header p {
    opacity: 0.75;
    font-size: 1.05rem;
    position: relative;
    z-index: 1;
}

/* 统计卡片 */
.stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1rem;
    margin-bottom: 2rem;
}

.stat-card {
    background: rgba(30, 40, 60, 0.7);
    backdrop-filter: blur(20px);
    border-radius: 18px;
    padding: 1.3rem;
    border: 1px solid rgba(255, 255, 255, 0.08);
    text-align: center;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
}

.stat-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: var(--stat-color);
    opacity: 0.8;
}

.stat-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
    border-color: var(--stat-color)30;
}

.stat-icon {
    width: 48px;
    height: 48px;
    background: var(--stat-color)18;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 0.8rem;
    color: var(--stat-color);
    font-size: 1.3rem;
}

.stat-number {
    font-size: 1.8rem;
    font-weight: 700;
    color: #fff;
    line-height: 1;
    margin-bottom: 0.3rem;
}

.stat-label {
    font-size: 0.85rem;
    opacity: 0.65;
}

/* 提醒区域 */
.alerts-section {
    background: linear-gradient(135deg, rgba(255, 152, 0, 0.12) 0%, rgba(244, 67, 54, 0.06) 100%);
    border-radius: 20px;
    padding: 1.5rem;
    margin-bottom: 2rem;
    border: 1px solid rgba(255, 152, 0, 0.2);
    animation: alert-appear 0.5s ease;
}

@keyframes alert-appear {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
}

.alerts-section h3 {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 1rem;
    color: #FF9800;
    font-size: 1.1rem;
}

.alert-item {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    padding: 0.9rem 1.1rem;
    border-radius: 12px;
    margin-bottom: 0.6rem;
    transition: all 0.3s;
    cursor: pointer;
}

.alert-item:hover {
    transform: translateX(5px);
}

.alert-item:last-child { margin-bottom: 0; }

.alert-item.danger {
    background: rgba(244, 67, 54, 0.15);
    border-left: 4px solid #F44336;
}

.alert-item.warning {
    background: rgba(255, 152, 0, 0.15);
    border-left: 4px solid #FF9800;
}

.alert-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.danger .alert-icon { background: rgba(244, 67, 54, 0.25); color: #F44336; }
.warning .alert-icon { background: rgba(255, 152, 0, 0.25); color: #FF9800; }

.alert-text {
    flex: 1;
    font-size: 0.95rem;
    line-height: 1.5;
}

.alert-time {
    font-size: 0.8rem;
    opacity: 0.5;
    flex-shrink: 0;
}

/* 添加设备区域 */
.add-device-section {
    background: rgba(30, 40, 60, 0.7);
    backdrop-filter: blur(20px);
    border-radius: 22px;
    padding: 2rem;
    margin-bottom: 2rem;
    border: 1px solid rgba(255, 255, 255, 0.08);
    position: relative;
    overflow: hidden;
}

.add-device-section::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, #2196F3, #9C27B0, #4CAF50);
}

.add-device-section h3 {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    margin-bottom: 1.5rem;
    font-size: 1.2rem;
    color: #E3F2FD;
}

.add-device-form {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 1rem;
    align-items: end;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
}

.form-group label {
    font-size: 0.9rem;
    opacity: 0.75;
    font-weight: 500;
}

.form-group input,
.form-group select {
    padding: 0.85rem 1.1rem;
    background: rgba(255, 255, 255, 0.07);
    border: 2px solid rgba(255, 255, 255, 0.12);
    border-radius: 12px;
    color: #fff;
    font-size: 1rem;
    transition: all 0.3s;
    outline: none;
}

.form-group input:focus,
.form-group select:focus {
    border-color: #2196F3;
    background: rgba(33, 150, 243, 0.05);
    box-shadow: 0 0 0 4px rgba(33, 150, 243, 0.1);
}

.form-group input::placeholder { opacity: 0.45; }

.form-group select option {
    background: #1a2332;
    color: #fff;
}

.btn-add-device {
    padding: 0.85rem 1.8rem;
    background: linear-gradient(135deg, #2196F3 0%, #9C27B0 100%);
    border: none;
    border-radius: 12px;
    color: white;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    white-space: nowrap;
    box-shadow: 0 4px 15px rgba(33, 150, 243, 0.3);
}

.btn-add-device:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 25px rgba(33, 150, 243, 0.45);
}

/* 设备列表 */
.devices-list {
    display: flex;
    flex-direction: column;
    gap: 1.3rem;
}

/* 设备卡片 */
.device-card {
    background: rgba(30, 40, 60, 0.75);
    backdrop-filter: blur(20px);
    border-radius: 22px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    overflow: hidden;
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    animation: device-card-in 0.5s ease backwards;
}

.device-card:nth-child(1) { animation-delay: 0.05s; }
.device-card:nth-child(2) { animation-delay: 0.1s; }
.device-card:nth-child(3) { animation-delay: 0.15s; }

@keyframes device-card-in {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

.device-card:hover {
    transform: translateY(-3px);
    border-color: rgba(33, 150, 243, 0.25);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(33, 150, 243, 0.08);
}

.device-top-bar {
    background: linear-gradient(90deg, rgba(33, 150, 243, 0.1) 0%, rgba(156, 39, 176, 0.06) 100%);
    padding: 1.3rem 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
}

.device-info {
    display: flex;
    align-items: center;
    gap: 1rem;
}

.device-avatar {
    width: 52px;
    height: 52px;
    background: linear-gradient(135deg, #2196F3 0%, #9C27B0 100%);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    color: white;
    box-shadow: 0 4px 15px rgba(33, 150, 243, 0.3);
    position: relative;
}

.device-avatar.online::after {
    content: '';
    position: absolute;
    bottom: -2px;
    right: -2px;
    width: 14px;
    height: 14px;
    background: #4CAF50;
    border-radius: 50%;
    border: 3px solid rgba(30, 40, 60, 0.75);
}

.device-avatar.offline::after {
    content: '';
    position: absolute;
    bottom: -2px;
    right: -2px;
    width: 14px;
    height: 14px;
    background: #9E9E9E;
    border-radius: 50%;
    border: 3px solid rgba(30, 40, 60, 0.75);
}

.device-name-area h3 {
    font-size: 1.15rem;
    font-weight: 600;
    margin-bottom: 0.2rem;
}

.device-meta {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    font-size: 0.85rem;
    opacity: 0.65;
}

.status-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    padding: 0.2rem 0.6rem;
    border-radius: 20px;
    font-size: 0.78rem;
    font-weight: 600;
}

.status-badge.online {
    background: rgba(76, 175, 80, 0.15);
    color: #4CAF50;
}

.status-badge.offline {
    background: rgba(158, 158, 158, 0.15);
    color: #9E9E9E;
}

.device-type-tag {
    background: rgba(156, 39, 176, 0.12);
    color: #CE93D8;
    padding: 0.2rem 0.55rem;
    border-radius: 6px;
    font-size: 0.75rem;
}

.device-actions {
    display: flex;
    gap: 0.5rem;
}

.btn-device-action {
    padding: 0.55rem 1rem;
    border: none;
    border-radius: 10px;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.25s;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-weight: 500;
}

.btn-status {
    background: rgba(33, 150, 243, 0.18);
    color: #64B5F6;
}
.btn-status:hover { background: rgba(33, 150, 243, 0.3); transform: translateY(-1px); }

.btn-delete {
    background: rgba(244, 67, 54, 0.15);
    color: #EF9A9A;
}
.btn-delete:hover { background: rgba(244, 67, 54, 0.28); transform: translateY(-1px); }

/* 垃圾桶状态区域 */
.device-bins {
    padding: 1.3rem 1.5rem;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.8rem;
}

.bin-card {
    background: rgba(255, 255, 255, 0.04);
    border-radius: 14px;
    padding: 1rem;
    text-align: center;
    transition: all 0.3s;
    border: 1px solid transparent;
    position: relative;
    overflow: hidden;
}

.bin-card:hover {
    background: rgba(255, 255, 255, 0.07);
    border-color: var(--bin-color)25;
}

.bin-icon-circle {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: var(--bin-color)15;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 0.7rem;
    color: var(--bin-color);
    font-size: 1.2rem;
    transition: all 0.3s;
}

.bin-card:hover .bin-icon-circle {
    background: var(--bin-color)25;
    transform: scale(1.08);
}

.bin-name {
    font-size: 0.88rem;
    font-weight: 600;
    margin-bottom: 0.6rem;
    opacity: 0.9;
}

.bin-level {
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 0.5rem;
    color: var(--bin-fill-color, var(--bin-color));
}

.bin-progress-track {
    background: rgba(255, 255, 255, 0.08);
    border-radius: 6px;
    height: 6px;
    overflow: hidden;
    position: relative;
}

.bin-progress-fill {
    height: 100%;
    border-radius: 6px;
    background: var(--bin-fill-color, var(--bin-color));
    transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
}

.bin-progress-fill::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    animation: shimmer 2s infinite;
}

@keyframes shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
}

/* 空状态 */
.empty-state {
    text-align: center;
    padding: 4rem 2rem;
    background: rgba(30, 40, 60, 0.5);
    border-radius: 22px;
    border: 2px dashed rgba(255, 255, 255, 0.1);
}

.empty-state i {
    font-size: 4rem;
    color: rgba(255, 255, 255, 0.12);
    margin-bottom: 1rem;
    display: block;
}

.empty-state p:first-of-type {
    font-size: 1.2rem;
    font-weight: 600;
    opacity: 0.6;
    margin-bottom: 0.4rem;
}

.empty-state p:last-of-type {
    opacity: 0.4;
    font-size: 0.95rem;
}

/* 响应式 */
@media (max-width: 768px) {
    .stats-row {
        grid-template-columns: repeat(2, 1fr);
    }
    
    .add-device-form {
        grid-template-columns: 1fr;
    }
    
    .device-bins {
        grid-template-columns: repeat(2, 1fr);
    }
    
    .device-top-bar {
        flex-direction: column;
        gap: 1rem;
        align-items: flex-start;
    }
    
    .device-actions {
        width: 100%;
    }
    
    .btn-device-action {
        flex: 1;
        justify-content: center;
    }
}
</style>

<div class="devices-page">
    <!-- 页面头部 -->
    <div class="devices-header">
        <h1><i class="fas fa-microchip"></i> 设备管理中心</h1>
        <p>绑定和管理您的智能垃圾桶，实时监控投放状态</p>
    </div>

    <!-- 统计概览 -->
    <div class="stats-row">
        <div class="stat-card" style="--stat-color: #2196F3;">
            <div class="stat-icon"><i class="fas fa-trash-alt"></i></div>
            <div class="stat-number" id="stat-total">0</div>
            <div class="stat-label">已绑定设备</div>
        </div>
        <div class="stat-card" style="--stat-color: #4CAF50;">
            <div class="stat-icon"><i class="fas fa-wifi"></i></div>
            <div class="stat-number" id="stat-online">0</div>
            <div class="stat-label">在线设备</div>
        </div>
        <div class="stat-card" style="--stat-color: #FF9800;">
            <div class="stat-icon"><i class="fas fa-exclamation-triangle"></i></div>
            <div class="stat-number" id="stat-alerts">0</div>
            <div class="stat-label">待处理提醒</div>
        </div>
        <div class="stat-card" style="--stat-color: #9C27B0;">
            <div class="stat-icon"><i class="fas fa-chart-pie"></i></div>
            <div class="stat-number" id="stat-avg">--%</div>
            <div class="stat-label">平均满溢度</div>
        </div>
    </div>

    <!-- 设备提醒 -->
    <div class="alerts-section" id="alerts-section" style="display: none;">
        <h3><i class="fas fa-bell"></i> 设备提醒</h3>
        <div id="alerts-list"></div>
    </div>

    <!-- 添加设备 -->
    <div class="add-device-section">
        <h3><i class="fas fa-plus-circle" style="color: #2196F3;"></i> 添加新设备</h3>
        <div class="add-device-form">
            <div class="form-group">
                <label><i class="fas fa-tag"></i> 设备名称</label>
                <input type="text" id="device-name" placeholder="例如：客厅智能垃圾桶" value="客厅智能垃圾桶">
            </div>
            <div class="form-group">
                <label><i class="fas fa-cog"></i> 设备类型</label>
                <select id="device-type">
                    <option value="standard">标准四分类垃圾桶</option>
                    <option value="compact">紧凑型垃圾桶</option>
                    <option value="smart">智能感应垃圾桶</option>
                </select>
            </div>
            <button class="btn-add-device" onclick="addDevice()">
                <i class="fas fa-plus"></i>
                <span>添加设备</span>
            </button>
        </div>
    </div>

    <!-- 设备列表 -->
    <div class="devices-list" id="devices-list">
        <div class="empty-state" id="empty-state">
            <i class="fas fa-box-open"></i>
            <p>暂无绑定设备</p>
            <p>添加您的第一个智能垃圾桶开始使用吧</p>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
const deviceTypeIcons = {
    'standard': 'fa-trash-alt',
    'compact': 'fa-box',
    'smart': 'fa-robot'
};

const deviceTypeNames = {
    'standard': '标准四分类',
    'compact': '紧凑型',
    'smart': '智能感应'
};

function loadDevices() {
    fetch('/api/devices')
    .then(response => response.json())
    .then(data => {
        if (data.devices && data.devices.length > 0) {
            document.getElementById('empty-state').style.display = 'none';
            renderDevices(data.devices);
            updateStats(data.devices);
            loadAlerts();
        } else {
            document.getElementById('stat-total').textContent = '0';
            document.getElementById('stat-online').textContent = '0';
            document.getElementById('stat-alerts').textContent = '0';
            document.getElementById('stat-avg').textContent = '--%';
        }
    })
    .catch(err => console.error('加载设备失败:', err));
}

function updateStats(devices) {
    const online = devices.filter(d => d.status === 'online').length;
    document.getElementById('stat-total').textContent = devices.length;
    document.getElementById('stat-online').textContent = online;
    
    let totalFill = 0, binCount = 0, alertCount = 0;
    devices.forEach(d => {
        if (d._bins) {
            d._bins.forEach(b => {
                totalFill += b.fill_level || 0;
                binCount++;
                if ((b.fill_level || 0) >= 80) alertCount++;
            });
        }
    });
    
    document.getElementById('stat-alerts').textContent = alertCount || '--';
    document.getElementById('stat-avg').textContent = binCount ? Math.round(totalFill / binCount) + '%' : '--%';
}

function loadAlerts() {
    Promise.all([
        fetch('/api/bin_alerts').then(r => r.json()),
        fetch('/api/filter_alerts').then(r => r.json())
    ])
    .then(([binAlerts, filterAlerts]) => {
        const allAlerts = [...(binAlerts.alerts || []), ...(filterAlerts.alerts || [])];
        if (allAlerts.length > 0) {
            document.getElementById('alerts-section').style.display = 'block';
            renderAlerts(allAlerts);
            document.getElementById('stat-alerts').textContent = allAlerts.length;
        } else {
            document.getElementById('alerts-section').style.display = 'none';
        }
    });
}

function renderAlerts(alerts) {
    const container = document.getElementById('alerts-list');
    const html = alerts.map(alert => `
        <div class="alert-item ${alert.level === 'danger' ? 'danger' : 'warning'}">
            <div class="alert-icon">
                <i class="fas ${alert.level === 'danger' ? 'fa-skull-crossbones' : 'fa-exclamation-triangle'}"></i>
            </div>
            <div class="alert-text">${alert.message}</div>
            <div class="alert-time">刚刚</div>
        </div>
    `).join('');
    container.innerHTML = html;
}

function renderDevices(devices) {
    const container = document.getElementById('devices-list');
    
    const html = devices.map(device => {
        const isOnline = device.status === 'online';
        const typeIcon = deviceTypeIcons[device.device_type] || 'fa-trash-alt';
        
        return `
            <div class="device-card">
                <div class="device-top-bar">
                    <div class="device-info">
                        <div class="device-avatar ${isOnline ? 'online' : 'offline'}">
                            <i class="fas ${typeIcon}"></i>
                        </div>
                        <div class="device-name-area">
                            <h3>${device.device_name}</h3>
                            <div class="device-meta">
                                <span class="status-badge ${isOnline ? 'online' : 'offline'}">
                                    <i class="fas fa-circle" style="font-size: 0.4rem;"></i>
                                    ${isOnline ? '在线运行中' : '离线'}
                                </span>
                                <span class="device-type-tag">
                                    <i class="fas fa-cog" style="font-size: 0.65rem; margin-right: 0.2rem;"></i>
                                    ${deviceTypeNames[device.device_type] || device.device_type}
                                </span>
                            </div>
                        </div>
                    </div>
                    <div class="device-actions">
                        <button class="btn-device-action btn-status" onclick="viewDeviceStatus(${device.id})">
                            <i class="fas fa-chart-line"></i> 详情
                        </button>
                        <button class="btn-device-action btn-delete" onclick="deleteDevice(${device.id})">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                </div>
                <div class="device-bins" id="bins-${device.id}">
                    <div style="grid-column: 1/-1; text-align: center; padding: 1.5rem; opacity: 0.5;">
                        <i class="fas fa-spinner fa-spin"></i> 正在加载状态...
                    </div>
                </div>
            </div>
        `;
    }).join('');
    
    container.innerHTML = html;
    
    devices.forEach(device => loadBinStatus(device.id));
}

function loadBinStatus(deviceId) {
    fetch(`/api/bin_status/${deviceId}`)
    .then(response => response.json())
    .then(data => {
        if (data.bins) {
            // Store bins for stats
            const deviceCard = document.querySelector(`#bins-${deviceId}`).closest('.device-card');
            if (deviceCard) deviceCard._deviceData = { bins: data.bins };
            
            // Update global stats
            const allCards = document.querySelectorAll('.device-card');
            let totalFill = 0, binCount = 0, alertCount = 0;
            allCards.forEach(card => {
                if (card._deviceData && card._deviceData.bins) {
                    card._deviceData.bins.forEach(b => {
                        totalFill += b.fill_level || 0;
                        binCount++;
                        if ((b.fill_level || 0) >= 80) alertCount++;
                    });
                }
            });
            document.getElementById('stat-alerts').textContent = alertCount || '--';
            document.getElementById('stat-avg').textContent = binCount ? Math.round(totalFill / binCount) + '%' : '--%';

            renderBins(deviceId, data.bins);
        } else {
            renderBinsEmpty(deviceId);
        }
    })
    .catch(() => renderBinsEmpty(deviceId));
}

function renderBinsEmpty(deviceId) {
    const container = document.getElementById(`bins-${deviceId}`);
    const binTypes = [
        { key: 'recyclable', name: '可回收物', color: '#2196F3', icon: 'fa-recycle', level: 0 },
        { key: 'wet', name: '厨余垃圾', color: '#4CAF50', icon: 'fa-leaf', level: 0 },
        { key: 'dry', name: '其他垃圾', color: '#9E9E9E', icon: 'fa-trash', level: 0 },
        { key: 'hazardous', name: '有害垃圾', color: '#F44336', icon: 'fa-skull-crossbones', level: 0 },
    ];
    container.innerHTML = binTypes.map(bin => renderBinItem(bin)).join('');
}

function renderBins(deviceId, bins) {
    const container = document.getElementById(`bins-${deviceId}`);
    
    const binInfoMap = {
        'recyclable': { name: '可回收物', color: '#2196F3', icon: 'fa-recycle' },
        'wet': { name: '厨余垃圾', color: '#4CAF50', icon: 'fa-leaf' },
        'dry': { name: '其他垃圾', color: '#9E9E9E', icon: 'fa-trash' },
        'hazardous': { name: '有害垃圾', color: '#F44336', icon: 'fa-skull-crossbones' }
    };
    
    const existingKeys = bins.map(b => b.bin_type);
    ['recyclable', 'wet', 'dry', 'hazardous'].forEach(key => {
        if (!existingKeys.includes(key)) {
            bins.push({ bin_type: key, fill_level: 0 });
        }
    });
    
    container.innerHTML = bins.map(bin => {
        const info = binInfoMap[bin.bin_type] || { name: '未知', color: '#9E9E9E', icon: 'fa-question' };
        return renderBinItem({
            ...info,
            level: bin.fill_level || 0
        });
    }).join('');
}

function renderBinItem(bin) {
    const fillLevel = bin.level || 0;
    const fillColor = fillLevel >= 80 ? '#F44336' : fillLevel >= 50 ? '#FF9800' : bin.color;
    
    return `
        <div class="bin-card" style="--bin-color: ${bin.color}; --bin-fill-color: ${fillColor};">
            <div class="bin-icon-circle">
                <i class="fas ${bin.icon}"></i>
            </div>
            <div class="bin-name">${bin.name}</div>
            <div class="bin-level">${fillLevel}%</div>
            <div class="bin-progress-track">
                <div class="bin-progress-fill" style="width: ${fillLevel}%;"></div>
            </div>
        </div>
    `;
}

function addDevice() {
    const name = document.getElementById('device-name').value.trim();
    const type = document.getElementById('device-type').value;
    
    if (!name) {
        alert('请输入设备名称');
        return;
    }
    
    const btn = event.target.closest('.btn-add-device');
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span>添加中...</span>';
    btn.disabled = true;
    
    fetch('/api/devices/add', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ device_name: name, device_type: type })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            document.getElementById('device-name').value = '';
            loadDevices();
        } else {
            alert(data.message || '添加失败');
        }
        btn.innerHTML = '<i class="fas fa-plus"></i> <span>添加设备</span>';
        btn.disabled = false;
    })
    .catch(() => {
        alert('网络错误，请重试');
        btn.innerHTML = '<i class="fas fa-plus"></i> <span>添加设备</span>';
        btn.disabled = false;
    });
}

function deleteDevice(deviceId) {
    if (!confirm('确定要删除这个设备吗？此操作不可恢复。')) return;
    
    const card = event.target.closest('.device-card');
    card.style.transition = 'all 0.3s';
    card.style.opacity = '0';
    card.style.transform = 'translateX(-30px)';
    
    setTimeout(() => {
        fetch(`/api/devices/delete/${deviceId}`, { method: 'POST' })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                loadDevices();
            } else {
                alert(data.message || '删除失败');
                card.style.opacity = '1';
                card.style.transform = 'none';
            }
        });
    }, 300);
}

function viewDeviceStatus(deviceId) {
    const modal = document.createElement('div');
    modal.style.cssText = `position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:9999;animation:fadeIn 0.2s;`;
    modal.innerHTML = `
        <div style="background:rgba(30,40,60,0.95);border-radius:24px;padding:2.5rem;max-width:480px;width:90%;border:1px solid rgba(255,255,255,0.1);animation:slideUp 0.3s;">
            <div style="text-align:center;margin-bottom:1.5rem;">
                <div style="width:64px;height:64px;background:linear-gradient(135deg,#2196F3,#9C27B0);border-radius:18px;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;font-size:1.6rem;color:#fff;"><i class="fas fa-info-circle"></i></div>
                <h2 style="font-size:1.3rem;margin-bottom:0.5rem;">设备详情</h2>
                <p style="opacity:0.6;font-size:0.95rem;">硬件功能即将上线，敬请期待！</p>
            </div>
            <div style="background:rgba(255,255,255,0.05);border-radius:14px;padding:1.2rem;margin-bottom:1.5rem;">
                <div style="display:flex;justify-content:space-between;padding:0.5rem 0;border-bottom:1px solid rgba(255,255,255,0.05);">
                    <span style="opacity:0.6;">固件版本</span>
                    <span>v1.0.0-beta</span>
                </div>
                <div style="display:flex;justify-content:space-between;padding:0.5rem 0;border-bottom:1px solid rgba(255,255,255,0.05);">
                    <span style="opacity:0.6;">信号强度</span>
                    <span style="color:#4CAF50;">良好 (-42dBm)</span>
                </div>
                <div style="display:flex;justify-content:space-between;padding:0.5rem 0;">
                    <span style="opacity:0.6;">上次同步</span>
                    <span>刚刚</span>
                </div>
            </div>
            <button onclick="this.closest('div').parentElement.remove()" style="width:100%;padding:1rem;background:linear-gradient(135deg,#2196F3,#9C27B0);border:none;border-radius:12px;color:#fff;font-size:1rem;font-weight:600;cursor:pointer;">我知道了</button>
        </div>
        <style>@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}@keyframes slideUp{from{transform:translateY(20px);opacity:0;}to{transform:translateY(0);opacity:1;}}</style>
    `;
    modal.onclick = (e) => { if(e.target===modal) modal.remove(); };
    document.body.appendChild(modal);
}

document.addEventListener('DOMContentLoaded', loadDevices);
</script>
{% endblock %}
